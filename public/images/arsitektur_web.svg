<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="100%" height="100%">
  <!-- Outer Frame -->
  <rect x="5" y="5" width="1140" height="610" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  
  <!-- Title -->
  <text x="575" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">Gambar 5.3 Arsitektur Web Pengunjung dan Admin (WebKRSV3)</text>
  
  <!-- ==================== ACTORS (x=20 to 140) ==================== -->
  <!-- Visitor Actor -->
  <g transform="translate(30, 90)">
    <circle cx="45" cy="40" r="12" fill="none" stroke="#000000" stroke-width="1.5" />
    <line x1="45" y1="52" x2="45" y2="90" stroke="#000000" stroke-width="1.5" />
    <line x1="30" y1="65" x2="60" y2="65" stroke="#000000" stroke-width="1.5" />
    <line x1="45" y1="90" x2="30" y2="115" stroke="#000000" stroke-width="1.5" />
    <line x1="45" y1="90" x2="60" y2="115" stroke="#000000" stroke-width="1.5" />
    <text x="45" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">PENGUNJUNG</text>
    <text x="45" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#000000" text-anchor="middle">(Masyarakat)</text>
  </g>
  
  <!-- Admin Actor -->
  <g transform="translate(30, 360)">
    <circle cx="45" cy="40" r="12" fill="none" stroke="#000000" stroke-width="1.5" />
    <line x1="45" y1="52" x2="45" y2="90" stroke="#000000" stroke-width="1.5" />
    <line x1="30" y1="65" x2="60" y2="65" stroke="#000000" stroke-width="1.5" />
    <line x1="45" y1="90" x2="30" y2="115" stroke="#000000" stroke-width="1.5" />
    <line x1="45" y1="90" x2="60" y2="115" stroke="#000000" stroke-width="1.5" />
    <text x="45" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">ADMIN</text>
    <text x="45" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#000000" text-anchor="middle">(Pengelola)</text>
  </g>

  <!-- ==================== FRONTEND CHANNELS (x=160 to 450) ==================== -->
  <!-- Visitor Web Portal Box -->
  <g transform="translate(150, 70)">
    <rect x="0" y="0" width="280" height="220" rx="5" fill="none" stroke="#000000" stroke-width="1.2" />
    <text x="140" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">VISITOR WEB PORTAL (Laravel Blade)</text>
    <line x1="10" y1="32" x2="270" y2="32" stroke="#000000" stroke-width="0.8" />
    
    <!-- Module items -->
    <rect x="15" y="45" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="72.5" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Dashboard &amp; Profil</text>
    
    <rect x="150" y="45" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="207.5" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Katalog Flora</text>

    <rect x="15" y="100" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="72.5" y="123" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Peta Interaktif (Leaflet)</text>
    
    <rect x="150" y="100" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="207.5" y="123" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Form Booking Kunjungan</text>

    <rect x="15" y="155" width="250" height="50" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="140" y="177" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Antarmuka Pengunjung</text>
    <text x="140" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#000000" text-anchor="middle">(Alpine.js, Axios &amp; Tailwind CSS)</text>
  </g>

  <!-- Admin Web Panel Box -->
  <g transform="translate(150, 330)">
    <rect x="0" y="0" width="280" height="250" rx="5" fill="none" stroke="#000000" stroke-width="1.2" />
    <text x="140" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">ADMIN WEB PANEL (Laravel Blade)</text>
    <line x1="10" y1="32" x2="270" y2="32" stroke="#000000" stroke-width="0.8" />
    
    <!-- Module items -->
    <rect x="15" y="45" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="72.5" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Dashboard &amp; Statistik</text>
    
    <rect x="150" y="45" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="207.5" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Kelola Katalog Flora</text>

    <rect x="15" y="100" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="72.5" y="123" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Kelola Kategori Flora</text>
    
    <rect x="150" y="100" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="207.5" y="123" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Kelola Peta &amp; Marker</text>

    <rect x="15" y="155" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="72.5" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Verifikasi Kunjungan</text>
    
    <rect x="150" y="155" width="115" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="207.5" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Kelola User &amp; Role</text>

    <rect x="15" y="205" width="250" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="140" y="226" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Kelola Profil Admin &amp; Password</text>
  </g>

  <!-- ==================== BACKEND LARAVEL SERVER (x=470 to 800) ==================== -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="360" height="510" rx="5" fill="none" stroke="#000000" stroke-width="1.5" />
    <text x="180" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">BACKEND SERVER (Laravel 12 / PHP 8.2)</text>
    <line x1="15" y1="35" x2="345" y2="35" stroke="#000000" stroke-width="1" />
    
    <!-- Modules Sub-box -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="330" height="210" rx="4" fill="none" stroke="#000000" stroke-width="1" />
      <text x="165" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Modules (Logika Bisnis)</text>
      
      <!-- Module 2x3 Grid -->
      <rect x="15" y="35" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="85" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Authentication Module</text>

      <rect x="175" y="35" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="245" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Catalog Flora Module</text>

      <rect x="15" y="90" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="85" y="113" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Mapping &amp; GeoJSON</text>

      <rect x="175" y="90" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="245" y="113" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Visitor Booking Module</text>

      <rect x="15" y="145" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="85" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">AVIF Optimizer Helper</text>

      <rect x="175" y="145" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="245" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Email Notification</text>
    </g>

    <!-- Core Services Sub-box -->
    <g transform="translate(15, 280)">
      <rect x="0" y="0" width="330" height="210" rx="4" fill="none" stroke="#000000" stroke-width="1" />
      <text x="165" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Laravel Core Services</text>
      
      <!-- Core Services items -->
      <rect x="15" y="35" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="85" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Web Route &amp; Middleware</text>

      <rect x="175" y="35" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="245" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Session &amp; Cookies</text>

      <rect x="15" y="90" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="85" y="113" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Controllers Layer</text>

      <rect x="175" y="90" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="245" y="113" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Eloquent ORM Models</text>

      <rect x="15" y="145" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="85" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Cache Driver (Database)</text>

      <rect x="175" y="145" width="140" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
      <text x="245" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">SMTP Mailer Service</text>
    </g>
  </g>

  <!-- ==================== POSTGRESQL DATABASE (x=850 to 1130) ==================== -->
  <g transform="translate(850, 70)">
    <rect x="0" y="0" width="270" height="310" rx="5" fill="none" stroke="#000000" stroke-width="1.5" />
    <text x="135" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">DATABASE (PostgreSQL)</text>
    <line x1="15" y1="35" x2="255" y2="35" stroke="#000000" stroke-width="1" />
    
    <!-- Table items -->
    <rect x="15" y="45" width="110" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="70" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">users</text>

    <rect x="145" y="45" width="110" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="200" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">koleksis</text>

    <rect x="15" y="95" width="110" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="70" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">categories</text>

    <rect x="145" y="95" width="110" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="200" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">map_markers</text>

    <rect x="15" y="145" width="240" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="135" y="166" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">pendaftaran_pengunjungs</text>

    <rect x="15" y="195" width="240" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="135" y="216" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">koleksi_map_marker</text>

    <rect x="15" y="245" width="110" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="70" y="266" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">koleksi_locations</text>

    <rect x="145" y="245" width="110" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="200" y="266" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">cache / jobs</text>
  </g>

  <!-- ==================== EXTERNAL SERVICES (x=850 to 1130) ==================== -->
  <g transform="translate(850, 400)">
    <rect x="0" y="0" width="270" height="180" rx="5" fill="none" stroke="#000000" stroke-width="1.5" />
    <text x="135" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">EXTERNAL SERVICES</text>
    <line x1="15" y1="30" x2="255" y2="30" stroke="#000000" stroke-width="1" />
    
    <!-- External Service boxes -->
    <rect x="15" y="40" width="240" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="135" y="61" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Google OAuth API (Sign-In)</text>

    <rect x="15" y="85" width="240" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="135" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">OpenStreetMap Map Tiles API</text>

    <rect x="15" y="130" width="240" height="35" rx="3" fill="none" stroke="#000000" stroke-width="0.8" />
    <text x="135" y="151" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Gmail SMTP Server (Email)</text>
  </g>

  <!-- ==================== ARROWS / COMMUNICATIONS ==================== -->
  <!-- Definitions of markers for arrowheads (simple black arrows) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" stroke="#000000" />
    </marker>
  </defs>

  <!-- Actor to Web Portal -->
  <path d="M 95 180 L 140 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 95 450 L 140 450" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Frontend portals to Laravel Backend (Web Server) -->
  <path d="M 430 180 L 470 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 430 450 L 470 450" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Laravel Backend to Database (SQL Queries) -->
  <path d="M 830 220 L 850 220" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 850 220 L 830 220" fill="none" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow)" />

  <!-- Laravel Backend to External Services -->
  <path d="M 800 490 L 850 490" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 850 490 L 800 490" fill="none" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow)" />

  <!-- Direct communication between Leaflet.js in Web Portal and OpenStreetMap API -->
  <path d="M 290 290 L 290 310 L 455 310 L 455 600 L 985 600 L 985 520" fill="none" stroke="#000000" stroke-dasharray="3,3" stroke-width="1" />
  <!-- Arrow from bottom pointing back up to OSM tiles -->
  <path d="M 985 600 L 985 490 L 1100 490" fill="none" stroke="#000000" stroke-dasharray="3,3" stroke-width="1" marker-end="url(#arrow)" />
  
</svg>
